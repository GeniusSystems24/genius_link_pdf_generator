name: genius_link_pdf_generator
description: A comprehensive PDF generation and preview library for Flutter applications with clean architecture design, RTL/LTR support, charts, plugin system, and seamless integration.
version: 2.7.0
homepage: https://github.com/GeniusSystems24/genius_link_pdf_generator

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  pdf: ^3.10.8
  syncfusion_flutter_pdf: ^31.2.18
  printing: ^5.13.3
  path_provider: ^2.1.4
  open_file: ^3.5.9
  intl: ^0.20.2
  share_plus: ^12.0.1
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.4
  cross_file: ^0.3.5+1
  image: ^4.3.0
  barcode: ^2.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# flutter:
  # This package does not include any assets
  # Fonts and images should be provided by the consuming app
